name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Root-level action directory name
        required: true
        type: string
      version:
        description: Stable SemVer without v (for example, 1.2.3)
        required: true
        type: string
      notes:
        description: Release notes for this action
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.action }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    name: Publish action release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases must run from the repository's default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Publish version and compatibility aliases
        env:
          ACTION_NAME: ${{ inputs.action }}
          ACTION_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/monorepo.py release
