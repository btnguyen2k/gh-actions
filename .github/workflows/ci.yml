name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install repository tooling
        run: python -m pip install --disable-pip-version-check --requirement .github/requirements.txt
      - name: Validate repository metadata
        run: python .github/scripts/monorepo.py validate
      - name: Test repository tooling
        run: python -m unittest discover --start-directory .github/scripts --pattern "test_*.py"
      - name: Test actions
        run: python .github/scripts/monorepo.py test
      - name: Check tracked generated files
        run: git diff --exit-code HEAD --
