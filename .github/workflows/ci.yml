name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  CaptureContext:
    name: Capture workflow context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target-sha: ${{ steps.context.outputs.target-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Capture workflow context
        id: context
        uses: ./workflow-context
      - name: Print workflow context
        env:
          EVENT_NAME: ${{ steps.context.outputs.event-name }}
          TARGET_SHA: ${{ steps.context.outputs.target-sha }}
          TARGET_BRANCH: ${{ steps.context.outputs.action-target-branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr-number }}
        run: |
          printf 'Event: %s\n' "$EVENT_NAME"
          printf 'Target SHA: %s\n' "$TARGET_SHA"
          printf 'Target branch: %s\n' "$TARGET_BRANCH"
          printf 'PR number: %s\n' "$PR_NUMBER"

  Validate:
    name: Validate and test (${{ matrix.os }})
    needs: CaptureContext
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.CaptureContext.outputs.target-sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install repository tooling
        run: python -m pip install --disable-pip-version-check --requirement .github/requirements.txt
      - name: Validate repository metadata
        run: python .github/scripts/monorepo.py validate
      - name: Test repository tooling
        run: python -m unittest discover --start-directory .github/scripts --pattern "test_*.py"
      - name: Test actions
        run: python .github/scripts/monorepo.py test
      - name: Check tracked generated files
        run: git diff --exit-code HEAD --
