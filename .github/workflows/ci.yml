name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  CaptureContext:
    name: Capture workflow context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target-sha: ${{ steps.context.outputs.target-sha }}
      action-target-branch: ${{ steps.context.outputs.action-target-branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture workflow context
        id: context
        uses: ./workflow-context
      - name: Print workflow context
        env:
          EVENT_NAME: ${{ steps.context.outputs.event-name }}
          TARGET_SHA: ${{ steps.context.outputs.target-sha }}
          TARGET_BRANCH: ${{ steps.context.outputs.action-target-branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr-number }}
        run: |
          printf 'Event: %s\n' "$EVENT_NAME"
          printf 'Target SHA: %s\n' "$TARGET_SHA"
          printf 'Target branch: %s\n' "$TARGET_BRANCH"
          printf 'PR number: %s\n' "$PR_NUMBER"

  ParseChangelog:
    name: Parse release changelog
    needs: CaptureContext
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.CaptureContext.outputs.target-sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Report pending releases
        env:
          CHANGELOG_BRANCH: ${{ github.base_ref || needs.CaptureContext.outputs.action-target-branch }}
        run: python .github/scripts/monorepo.py changelog

  Validate:
    name: Validate and test (${{ matrix.os }})
    needs: CaptureContext
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.CaptureContext.outputs.target-sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          check-latest: true
      - name: Install repository tooling
        run: python -m pip install --disable-pip-version-check --requirement .github/requirements.txt
      - name: Validate repository metadata
        run: python .github/scripts/monorepo.py validate
      - name: Test repository tooling
        run: python -m unittest discover --start-directory .github/scripts --pattern "test_*.py"
      - name: Test actions
        run: python .github/scripts/monorepo.py test
      - name: Check tracked generated files
        run: git diff --exit-code HEAD --
