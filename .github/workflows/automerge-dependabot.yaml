# Automatically merge PRs from dependabot

name: "Automerge-Dependabot"

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ "completed" ]

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              console.log('ℹ️ Skipped: no associated PR.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            if (
              pr.user?.login !== 'dependabot[bot]' ||
              pr.base.ref !== context.payload.repository.default_branch ||
              pr.state !== 'open' ||
              pr.draft
            ) {
              console.log(`ℹ️ Skipped PR #${prNumber}: not an open, non-draft Dependabot PR into the default branch.`);
              return;
            }
            if (pr.head.sha !== run.head_sha) {
              console.log(`ℹ️ Skipped PR #${prNumber}: head ${pr.head.sha} does not match successful CI ${run.head_sha}.`);
              return;
            }
            const { data: result } = await github.rest.pulls.merge({
              ...context.repo,
              pull_number: prNumber,
              sha: run.head_sha,
            });
            if (!result.merged) {
              throw new Error(`❌ PR #${prNumber} was not merged: ${result.message}`);
            }
            console.log(`✅ Merged PR #${prNumber}.`);
