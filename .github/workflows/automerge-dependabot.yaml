# Automatically merge PRs from dependabot

name: "Automerge-Dependabot"

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ "completed" ]

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge PR
        id: merge
        uses: ./automerge-dependabot
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report merge result
        shell: bash
        env:
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          MERGE_REASON: ${{ steps.merge.outputs.reason }}
          PR_NUMBER: ${{ steps.merge.outputs.pr-number }}
        run: |
          if [ "$MERGE_STATUS" = "merged" ]; then
            printf '✅ Merged PR #%s.\n' "$PR_NUMBER"
          elif [ -n "$PR_NUMBER" ]; then
            printf 'ℹ️ Skipped PR #%s: %s.\n' "$PR_NUMBER" "$MERGE_REASON"
          else
            printf 'ℹ️ Skipped: %s.\n' "$MERGE_REASON"
          fi
